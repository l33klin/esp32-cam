[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

# WCH USB-to-UART port, verified on the user's board (VID:PID 1A86:55D3).
[env:esp32s3_uart]
extends = env:esp32s3
upload_speed = 230400
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1

# Keep the 180-degree mounting rotation and undo horizontal mirroring.
[env:esp32s3_uart_unmirrored]
extends = env:esp32s3_uart
build_flags =
  ${env:esp32s3_uart.build_flags}
  -DINDOORCAM_MIRROR_CORRECTION=1

# Compile all camera/network paths without requiring real hardware.
# Do not flash this environment before replacing the example pinout.
[env:compile_check]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DINDOORCAM_PINS_CONFIRMED=1

# Temporary Wi-Fi throughput isolation. Restore esp32s3_uart after diagnosis.
[env:wifi_diag]
extends = env:esp32s3_uart
build_src_filter = +<wifi_diag.cpp>

